<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- LOGIN -->
  <div id="login-screen" class="screen hidden">
    <div class="login-container">
      <div class="login-brand">
        <div class="login-logo">📺</div>
        <h1>TV Time</h1>
        <p class="login-sub">Track your shows</p>
      </div>
      <form id="login-form">
        <div class="input-group">
          <input type="text" id="email" placeholder="Email or username" required autocomplete="username">
        </div>
        <div class="input-group">
          <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
        </div>
        <button type="submit" id="login-btn" class="btn-primary">
          <span class="btn-text">Sign In</span>
          <span class="btn-loader hidden">
            <span class="dot-pulse"></span>
          </span>
        </button>
        <div id="login-error" class="login-error hidden"></div>
      </form>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main-screen" class="screen hidden">
    <header class="app-header">
      <div class="header-brand">📺 <span>TV Time</span></div>
      <div class="header-actions">
        <button id="refresh-btn" class="icon-btn" title="Refresh">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
        </button>
        <button id="logout-btn" class="icon-btn" title="Sign out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="up-next">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21"/></svg>
        Up Next
      </button>
      <button class="tab" data-tab="my-shows">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        My Shows
      </button>
      <button class="tab" data-tab="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Search
      </button>
      <button class="tab" data-tab="api-lab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 3 7l9 5 9-5-9-5z"/><path d="m3 17 9 5 9-5"/><path d="m3 12 9 5 9-5"/></svg>
        API Lab
      </button>
    </nav>

    <div class="tab-content">
      <div id="tab-up-next" class="tab-pane active">
        <div id="up-next-list"></div>
      </div>
      <div id="tab-my-shows" class="tab-pane">
        <div id="my-shows-list"></div>
      </div>
      <div id="tab-search" class="tab-pane">
        <div class="search-bar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-input" placeholder="Search TV shows...">
        </div>
        <div id="search-results"></div>
      </div>
      <div id="tab-api-lab" class="tab-pane">
        <div class="api-lab-controls">
          <button id="api-lab-run" class="api-lab-run-btn">Run Full API Audit</button>
          <label class="api-lab-check">
            <input type="checkbox" id="api-lab-include-mutations" checked>
            Include mutation route checks
          </label>
          <label class="api-lab-check">
            <input type="checkbox" id="api-lab-live-mutations">
            Use live IDs for mutation checks (can change account data)
          </label>
          <div class="api-lab-actions">
            <button id="api-lab-copy" class="api-lab-action-btn" disabled>Copy JSON</button>
            <button id="api-lab-save" class="api-lab-action-btn" disabled>Save JSON</button>
          </div>
        </div>
        <div id="api-lab-results"></div>
      </div>
    </div>
  </div>

  <!-- SHOW DETAIL OVERLAY -->
  <div id="show-detail" class="screen hidden">
    <div class="detail-header">
      <button id="detail-back" class="icon-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <h2 id="detail-title"></h2>
    </div>
    <div id="detail-hero"></div>
    <div id="detail-content"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
