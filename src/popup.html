<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <!-- LOGIN -->
  <div id="login-screen" class="screen hidden">
    <div class="login-container">
      <div class="login-brand">
        <div class="login-logo">📺</div>
        <h1>TV Time</h1>
        <p class="login-sub">Track your shows</p>
      </div>
      <form id="login-form">
        <div class="input-group">
          <input type="text" id="username" placeholder="Username" required autocomplete="username">
        </div>
        <div class="input-group password-group">
          <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
          <button type="button" id="toggle-password" class="toggle-password-btn" title="Toggle Password Visibility">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
        <button type="submit" id="login-btn" class="btn-primary">
          <span class="btn-text">Sign In</span>
          <span class="btn-loader hidden">
            <span class="dot-pulse"></span>
          </span>
        </button>
        <div id="login-error" class="login-error hidden"></div>
      </form>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main-screen" class="screen hidden">
    <header class="app-header">
      <div class="header-brand">📺 <span>TV Time</span></div>
      <div class="header-actions">
        <button id="open-my-shows-btn" class="icon-btn" title="My Shows">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
          </svg>
        </button>
        <button id="open-search-btn" class="icon-btn" title="Search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </button>
        <button id="refresh-btn" class="icon-btn" title="Refresh">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 2v6h-6" />
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
            <path d="M3 22v-6h6" />
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
          </svg>
        </button>
        <button id="logout-btn" class="icon-btn" title="Sign out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
        </button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="watch-list">
        WATCH LIST
      </button>
      <button class="tab" data-tab="upcoming">
        UPCOMING
      </button>
    </nav>

    <div class="tab-content">
      <div id="tab-watch-list" class="tab-pane active">


        <div class="search-bar upnext-search-bar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input type="text" id="watchlist-search-input" placeholder="Search in Watch List...">
        </div>
        <div id="watch-list-list"></div>
      </div>
      <div id="tab-upcoming" class="tab-pane">
        <div class="upcoming-header">
          <div class="upcoming-title">Schedule</div>
          <button id="upcoming-view-btn" class="icon-btn" title="Toggle Calendar/List">
            <svg class="icon-calendar" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
            <svg class="icon-list hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2">
              <line x1="8" y1="6" x2="21" y2="6" />
              <line x1="8" y1="12" x2="21" y2="12" />
              <line x1="8" y1="18" x2="21" y2="18" />
              <line x1="3" y1="6" x2="3.01" y2="6" />
              <line x1="3" y1="12" x2="3.01" y2="12" />
              <line x1="3" y1="18" x2="3.01" y2="18" />
            </svg>
          </button>
        </div>
        <div id="upcoming-list"></div>
        <div id="upcoming-calendar" class="hidden"></div>
      </div>
    </div>

    <div id="quick-panel" class="quick-panel hidden">
      <div class="quick-panel-header">
        <button id="quick-panel-back" class="icon-btn" title="Back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="19" y1="12" x2="5" y2="12" />
            <polyline points="12 19 5 12 12 5" />
          </svg>
        </button>
        <h3 id="quick-panel-title"></h3>
      </div>
      <div class="quick-panel-body">
        <div id="quick-pane-my-shows" class="quick-pane hidden">
          <div id="my-shows-list"></div>
        </div>
        <div id="quick-pane-search" class="quick-pane hidden">
          <div class="search-bar quick-search-bar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" id="search-input" placeholder="Search TV shows...">
          </div>
          <div id="search-results"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- SHOW DETAIL OVERLAY -->
  <div id="show-detail" class="screen hidden">
    <div class="detail-header">
      <button id="detail-back" class="icon-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
      </button>
      <h2 id="detail-title"></h2>
    </div>
    <div id="detail-hero"></div>
    <div id="detail-content"></div>
  </div>

  <script src="popup.js?v=20260211-perf-preload1"></script>
</body>

</html>
